<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bônus Bancário Inteligente</title>
</head>
<!--Refaça o programa anterior de tal forma que: 
A cada 3 depósitos o banco dê um bônus de 1% sobre o valor acumulado após o depósito. Ex:   

    1º Mês: R$ 500.00   

    2º Mês: R$ 1000.00   

    3º Mês: R$ 1515.00   

    4º Mês: R$ 2015.00   

    5º Mês: R$ 2515.00   

    6º Mês: R$ 3045.15   

    Total guardado: R$3045.15   

Note que nos meses 3 e 6, o valor aumentou em 1% do total após o depósito.   -->
<body>
    <h1>7. Bônus Bancário Inteligente</h1>
        <p>Informe quantos depósitos você fez no banco:</p>
    <input type="number" id="ipt_depositos">
    <p>Informe o valor de cada depósito:</p>
    <input type="number" id="ipt_valor">

    <br> <br>

    <button onclick="mostrarGrana()">Acompanhar grana</button>
    <br>

    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function mostrarGrana(){
        let qtd_depositos = Number(ipt_depositos.value);
        let valor = Number(ipt_valor.value);
        div_mensagem.innerHTML = "";
        let valor_total = 0;

        console.log(qtd_depositos);
        console.log(valor);

        for (i = 1; i <= qtd_depositos; i++){
            valor_total += valor;

            if(i % 3 == 0){
                valor_total = valor_total*1.01;
                div_mensagem.innerHTML += `${i}º Mês: R$${valor_total.toFixed(2)} <br>`;

            } else {
                div_mensagem.innerHTML += `${i}º Mês: R$${(valor_total.toFixed(2))} <br>`;
            }
        }
        div_mensagem.innerHTML += `Total guardado: R$${(valor_total).toFixed(2)}<br>`;
    }
</script>
