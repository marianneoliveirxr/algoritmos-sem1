<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12 - Sem vetor</title>
</head>
<body>
    <p>Escreva o texto que deseja inverter:</p>
    <input type="text" id="ipt_texto">
    <button onclick="inverter()">Inverter Texto</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function inverter(){
        let texto = ipt_texto.value;

        for(let i = texto.length - 1; i >= 0; i--){
                    div_mensagem.innerHTML += texto[i];
        }
    }
</script>
