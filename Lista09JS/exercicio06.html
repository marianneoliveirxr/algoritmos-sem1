Lista09JS/exercicio06.html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhando a Poupança</title>
</head>
<!--
Crie um programa no qual:   
a) O usuário informa quantos depósitos ele fez no banco   

b) O usuário informa o valor de cada depósito, pois ele sempre depositava exatamente o mesmo valor   

c) Ao clicar em "Acompanhar grana", deve aparecer o valor, mês a mês, como neste exemplo   

    1º Mês: R$ 500.00   

    2º Mês: R$ 1000.00   

    3º Mês: R$ 1500.00   

    4º Mês: R$ 2000.00   

    5º Mês: R$ 2500.00   

    Total guardado: R$2500.00   

No exemplo acima, o usuário informou 5 depósitos e 500 por depósito. -->
<body>
    <h1>6. Acompanhando a Poupança</h1>
    <p>Informe quantos depósitos você fez no banco:</p>
    <input type="number" id="ipt_depositos">
    <p>Informe o valor de cada depósito:</p>
    <input type="number" id="ipt_valor">

    <br> <br>

    <button onclick="mostrarGrana()">Acompanhar grana</button>
    <br>

    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function mostrarGrana(){
        let qtd_depositos = Number(ipt_depositos.value);
        let valor = Number(ipt_valor.value);
        div_mensagem.innerHTML = "";

        console.log(qtd_depositos);
        console.log(valor);

        for (i = 1; i <= qtd_depositos; i++){
                div_mensagem.innerHTML += `${i}º Mês: R$${(valor * i.toFixed(2))} <br>`;
        }
        div_mensagem.innerHTML += `Total guardado: R$${(valor * qtd_depositos).toFixed(2)}<br>`;
    }
</script>
