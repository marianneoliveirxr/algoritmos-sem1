<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Primos</title>
</head>
<!-- Crie  um programa o qual:

a) Ao exibir os divisores do número informado, caso o número seja divisível somente por 1
 e por ele mesmo, exiba abaixo: 
     Divisores do Número 13:

     1

     13

     O número 13 é um número primo.-->
<body>
    <h1>1. Números Primos</h1>
    <p>Informe um número:</p>
    <input type="number" id="ipt_num">

    <button onclick="exibirDivisores()">Exibir Divisores</button>

    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function exibirDivisores(){
        let numero = Number(ipt_num.value);
        div_mensagem.innerHTML = "";

        let c = 0;
        for (i = 0; i <= numero; i++){
            if(numero % i == 0){
                c++;
                div_mensagem.innerHTML += `${i} <br>`;
            }
        }

        if(c == 2){
            div_mensagem.innerHTML += `O número ${numero} é um número primo!`;
        }
    }
</script>
