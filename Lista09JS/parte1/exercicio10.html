<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fases da Vida</title>
</head>
<!--Crie um programa que vá contando a idade do usuário e descrevendo sua fase na vida, considerando que:   

    - Primeira Infância: 0 a 4 anos   

    - Pré-escolar: + de 4 aos 6 anos   

    - Segunda Infância: + de 6 aos 10 anos   

    - Adolescência: + de 10 aos 18 anos   

    - Adulto: + de 18 até os 50 anos   

    - Melhor idade: + de 50 anos até 100 anos   

    - Matusalém: + de 100 anos   

Assim, sua página HTML deve solicitar a idade do usuário. Na medida em que for digitando 
(pesquise por onkeyup ou oninput), deve aparecer uma contagem de idade e indicação de fase da vida abaixo como neste exemplo:   

   0 anos (Primeira Infância)   

   1 anos (Primeira Infância)   

   2 anos (Primeira Infância)   

   3 anos (Primeira Infância)   

   4 anos (Primeira Infância)   

   5 anos (Pré-escolar)   

   6 anos (Pré-escolar)   

   7 anos (Segunda Infância)   

   ....   

A última linha deve ser a idade informada.   -->
<body>
    <h1>10. Fases da Vida</h1>
    <p>Qual a sua idade?</p>
    <input type="number" oninput="fasesVida()" id="ipt_idade">
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function fasesVida(){
        let idade = Number(ipt_idade.value);
        div_mensagem.innerHTML = "";

        for (let i = 0; i <= idade; i++){
            
            if(i >= 0 && i <= 4){
                div_mensagem.innerHTML += `${i} anos (Primeira infância) <br>`
            }
            else if(i > 4 && i <= 6){
                div_mensagem.innerHTML += `${i} anos (Pré-escolar) <br>`
            }
            else if (i > 6 && i <= 10){
                div_mensagem.innerHTML += `${i} anos (Segunda infância) <br>`
            }
            else if (i > 10 && i <= 18){
                div_mensagem.innerHTML += `${i} anos (Adolescência) <br>`
            }
            else if (i > 18 && i <= 50){
                div_mensagem.innerHTML += `${i} anos (Adulto) <br>`
            }
            else if (i > 50 && i <= 100){
                div_mensagem.innerHTML += `${i} anos (Melhor idade) <br>`
            }
            else {
                div_mensagem.innerHTML += `${i} anos (Matusalém) <br>`
            }
            
        }
    }
</script>
