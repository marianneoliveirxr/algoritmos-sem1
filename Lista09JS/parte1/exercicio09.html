<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzBuzz</title>
</head>
<!--9. FizzBuzz
Crie um script em JavaScript que resolva o clássico problema do FizzBuzz e exiba o 
resultado dentro de uma div na página utilizando innerHTML.

Regras do FizzBuzz:
Para números de 1 a 100:

Se o número for múltiplo de 3, exiba "Fizz".

Se o número for múltiplo de 5, exiba "Buzz".

Se o número for múltiplo de 3 e 5, exiba "FizzBuzz".

Caso contrário, exiba o próprio número.-->
<body>
    <h1>9. FizzBuzz</h1>
    <button onclick="iniciar()">Iniciar</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function iniciar(){
        for(let i = 1; i < 101; i++){
            if (i % 3 == 0){
                div_mensagem.innerHTML += `Fizz <br>`;
            } else if (i % 5 == 0){
                div_mensagem.innerHTML += `Buzz <br>`;
            } else if (i % 3 == 0 && i % 5 == 0){
                div_mensagem.innerHTML += `FizzBuzz <br>`;
            } else {
                div_mensagem.innerHTML += i + "<br>";
            }

        }
    }
</script>
