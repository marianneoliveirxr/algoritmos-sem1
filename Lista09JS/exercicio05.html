<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café com Leite na Medida Certa</title>
</head>
<!--Crie um programa no qual:   
a) O usuário informa quantas xícaras de café com leite ele já tomou na vida   

b) Ao clicar em "Ver a quantidade", devem aparecer na tela X colheres com leite em pó 
e Y colheres de café em pó. Para cada xícara de café com leite informada em 
a) considere que o usuário usa 1 colher de leite e 2 de café. Assim você saberá os valores de X e Y.-->
<body>
    <h1>5. Café com Leite na Medida Certa</h1>
    <p>Quantas xícaras de café com leite você acha que já bebeu na vida?</p>
    <input type="number" id="ipt_qtd">

    <button onclick="analisarXicaras()">Ver quantidade</button>

    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function analisarXicaras(){
        let qtd = Number(ipt_qtd.value);

        div_mensagem.innerHTML = "";

        for (i = 0; i < qtd; i++){
            div_mensagem.innerHTML += `<img width= 100; src="img/leiteempo.png" alt="colher de leite em pó">`;
            div_mensagem.innerHTML += `<img width= 100; src="img/cafe.png" alt="colher de café em pó">`;
            div_mensagem.innerHTML += `<img width= 100; src="img/cafe.png" alt="colher de café em pó"> <br>`;
        }
    }
</script>
