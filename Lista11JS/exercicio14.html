<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 14</title>
</head>
<!-- a) Ao clicar no botão "Ver a Lua", sorteie um dia do mês entre 1 e 31 e exiba o número sorteado 
 na página  

b) Mostre uma fase da lua, de acordo com o dia sorteado, conforme estes critérios 
(pode baixar e deixar as imagens locais, se preferir):  

   "Lua nova", caso o dia do mês esteja entre 1 e 7  

   "Lua cheia", caso o dia do mês esteja entre 8 e 16  

   "Lua minguante", caso o dia do mês esteja entre 17 e 22  

   "Lua crescente", caso o dia do mês esteja entre 23 e 31  -->
<body>
    <button onclick="lua()">Ver lua</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function lua(){
        let dia = (Math.random() * (31 - 1) + 1).toFixed(0);

        if (dia >= 1 && dia <= 7){
            div_mensagem.innerHTML = `Dia: ${dia} - Lua nova`;
        }
        else if(dia >= 8 && dia <= 16){
            div_mensagem.innerHTML = `Dia: ${dia} - Lua cheia`;
        }
        else if (dia >= 17 && dia <= 22){
            div_mensagem.innerHTML = `Dia: ${dia} - Lua minguante`;
        }
        else if(dia >= 23 && dia <= 31){
            div_mensagem.innerHTML = `Dia: ${dia} - Lua crescente`;
        }
    }
</script>
