<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11</title>
</head>
<!-- a) Ao clicar no botão "Avaliar". Esse botão vai gerar uma avaliação aleatória 
 entre 0 e 5 (números reais com uma casa decimal)  

b) Mostra, abaixo, a nota da avaliação. Ex: "Nota recebida: 4.5"  

c) De acordo com a avaliação aleatória recebida, mostre um emoji, segundo os seguintes 
critérios (pode baixar e deixar as imagens locais, se preferir):  

   "Muito Triste", caso a nota seja entre 0 e 0.5  

   "Meio Triste", caso a nota seja mais de 0.5 até 1.5  

   "Neutro", caso a nota seja mais de 1.5 até 3.5  

   "Feliz", caso a nota seja mais de 3.5 até 4.5  

   "Muito Feliz", caso a nota seja mais de 4.5   -->
<body>
    <button onclick="avaliar()">Avaliar</button>
    <div id="div_mensagem"></div>

</body>
</html>
<script>
    function avaliar(){

        div_mensagem.innerHTML = "";
        
        let nota = (Math.random() * (5 - 1) + 1).toFixed(1);
        div_mensagem.innerHTML += `Nota recebida: ${nota} <br>`;

        if(nota >=0 && nota <= 0.5){
            div_mensagem.innerHTML += "Muito triste";
        }
        else if (nota > 0.5 && nota <= 1.5){
            div_mensagem.innerHTML += "Meio triste";
        }
        else if(nota > 1.5 && nota <= 3.5){
            div_mensagem.innerHTML += "Neutro";
        } 
        else if(nota > 3.5 && nota <= 4.5){
            div_mensagem.innerHTML += "Feliz";
        }
        else if(nota > 4.5){
            div_mensagem.innerHTML += "Muito Feliz";
        }
    }
</script>
