<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8</title>
</head>
<!--a) Tenha um botão "Gerar uma nota de aluno entre 0 e 10" que faz aparecer, abaixo dele, 
a nota gerada  

b) Tenha um botão "Gerar uma frequência de aluno entre 0 e 100" que faz aparecer, abaixo dele, 
a frequência gerada  

c) Deixe todos os valores com 2 casas decimais na tela  

d) Ao clicar no botão “Ver Situação", emitir um alerta com a situação desse aluno. -->
<body>
    <center>
        <button onclick="gerarNota()">Gerar uma nota de aluno entre 0 e 10</button> 
        <br> <br>
        <div id="n"></div> 
        <br>
        <button onclick="gerarFrequencia()">Gerar uma frequência de aluno entre 0 e 100</button>
        <br> <br>
        <div id="freq"></div>
        <br>
        <button onclick="analisarSituacao()">Ver situação</button> 
        <br> <br>
        <div id="situacao"></div>
    </center>
</body>
</html>
<script>
    let notas = [];
    let frequencias = [];
    

    let frequencia = Math.random() * 100;
    let nota = Math.random() * 10;

    function gerarNota(){
        
        n.innerHTML = `${nota.toFixed(2)}`

        console.log(nota);
    }
    function gerarFrequencia(){
        
        freq.innerHTML = `${frequencia.toFixed(2)}`

        console.log(frequencia)
    }
    function analisarSituacao(){

        if (
            nota.toFixed(2) >= 0 && nota.toFixed(2) <= 5.5
            && frequencia.toFixed(2) <= 75
            )
        {
            situacao.innerHTML += `Nota ${nota.toFixed(2)} abaixo da média <br> 
                                    Frequência ${frequencia.toFixed(2)}%  abaixo da média<br>
                                    Situação crítica!!`
        }
        else if(
            nota.toFixed(2) >= 0 && nota.toFixed(2) <= 5.5
            && frequencia.toFixed(2) > 75
        ){
            situacao.innerHTML += ` Nota ${nota.toFixed(2)} abaixo da média <br> 
                                    Frequência ${frequencia.toFixed(2)}% acima da média<br>
                                    Precisa estudar mais!!`
        }
        else if(
            nota.toFixed(2) >= 6 && nota.toFixed(2) <= 10
            && frequencia.toFixed(2) <= 75
        ){
            situacao.innerHTML += ` Nota ${nota.toFixed(2)}  acima da média <br> 
                                    Frequência ${frequencia.toFixed(2)}% abaixo da média<br>
                                    Vai repetir mesmo com notas boas, fica de olho!!`
        }
        else if(
            nota.toFixed(2) >= 6 && nota.toFixed(2) <= 10
            && frequencia.toFixed(2) > 75
        ){
            situacao.innerHTML += ` ${nota.toFixed(2)} Nota abaixo da média <br> 
                                    Frequência ${frequencia.toFixed(2)}% acima da média<br>
                                    Que orgulho!!`
        }
        
    }
</script>
