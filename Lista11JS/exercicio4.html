<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<!-- a) Ao clicar no botão "Sortear Nota para aluno", apareça na página um 
 número aleatório, entre 0 e 10 (podem ser sorteados números decimais com uma casa decimal, 
 como "8.5", por exemplo).  -->
<body>
    <button onclick="sortear()">Sortear Nota para o Aluno</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function sortear(){
        let nota = Math.random() * (10 - 0);

        div_mensagem.innerHTML = `${nota.toFixed(1)}`
    }
</script>
