<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>
</head>
<!--a) Tenha um botão "Dado Jogador 1" que faz aparecer, abaixo dele, o valor de um dadinho de 6 lados
 sorteado  

b) Tenha um botão "Dado Jogador 2" que faz aparecer, abaixo dele, o valor de um dadinho de 6 lados 
sorteado  

c) Tenha um botão "Comparar Resultados", que exibe uma das frases abaixo de tudo:  

  "Jogador [1 ou 2] venceu", caso um deles tenha vencido  

  "Empate!", em caso dos dados serem iguais 

  -->
<body>
    <button onclick="dadoJ1()">Dado Jogador 1</button>
    <div id="j1"></div>
    <button onclick="dadoJ2()">Jogador 2</button>
    <div id="j2"></div>
    <button onclick="comparar()">Comparar resultados</button>
    <div id="resultado"></div>
</body>
</html>
<script>

    let jogador1 = 0;
    let jogador2 = 0;


    function dadoJ1(){
        jogador1 = (Math.random() * (6-1) + 1).toFixed(0);
        j1.innerHTML = `${jogador1}`;
    }
    
    function dadoJ2(){
        jogador2 = (Math.random() * (6 - 1) + 1).toFixed(0);
        j2.innerHTML = `${jogador2}`;
    }

    function comparar(){
        if(jogador1 > jogador2){
            resultado.innerHTML = "Jogador 1 venceu!"
        }
        else if(jogador2 > jogador1){
            resultado.innerHTML = "Jogador 2 venceu!"
        } 
        else if(jogador1 == jogador2){
            resultado.innerHTML = "Empate!"
        }
    
    }
    
    
</script>
