<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 13</title>
</head>
<!-- a) Ao clicar no botão "Sortear temperatura", sorteia valores reais entre -20 e +20 
 (intervalo fechado) e exibe uma frase como esta: "Temperatura sorteada: X"  

b) Exiba uma dessas mensagens abaixo da temperatura sorteada:  

    "Dá pra conservar qualquer alimento", se a temperatura for menor que 1  

    "Conserva a maioria dos alimentos", se a temperatura for entre 1 e 10  

    "Estraga a maioria dos alimentos", se a temperatura for maior que 10 

OBS: Exiba as temperaturas como números inteiros, sem casas decimais  -->
<body>
    <button onclick="sortearTemp()">Sortear temperatura</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function sortearTemp(){
        let temperatura = (Math.random() * (20 - (-20) + (-20))).toFixed(0);

        div_mensagem.innerHTML = "";

        div_mensagem.innerHTML += `Temperatura sorteada: ${temperatura}°C <br>`;

        if(temperatura < 1){
            div_mensagem.innerHTML += `Dá pra conservar qualquer alimento <br>`;
        }
        else if (temperatura >=1 && temperatura <= 10){
            div_mensagem.innerHTML += `Conserva a maioria dos alimentos <br>`;
        }
        else if(temperatura > 10){
            div_mensagem.innerHTML += `Estraga a maioria dos alimentos <br>`;
        }
    }
</script>
