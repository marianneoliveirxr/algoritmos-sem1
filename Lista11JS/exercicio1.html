<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
    <!-- a) Ao clicar em um botão "Sortear", apareça na página 
     um número aleatório, entre 0 e 0.9999;  

    b) Se esse número for maior que 0.5, exibir, abaixo, a frase 
    "Eu arredondaria para 1".  Caso contrário, exiba "Eu arredondaria para 0".  -->
</head>
<body>
    <button onclick="sorteio()">Sortear</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function sorteio(){
        let numero = Math.random() * (0.9999 - 0);

        if (numero > 0.5){
            div_mensagem.innerHTML = `${numero} Eu arredondaria para 1`
        }
        else {
            div_mensagem.innerHTML = `${numero} Eu arredondaria para 0`;
        }
    }
</script>
