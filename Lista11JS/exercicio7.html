<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7</title>
</head>
<!--a) Ao clicar no botão "Quero um número cabalístico!", deve sortear e exibir na tela, 
um número entre 1 e 15  

b) Se o número sorteado for cabalístico (se for o número 3, 4, 7, 10 ou 12), deve aparecer
 uma frase abaixo do número, dizendo "Eu S2 números cabalísticos!" 

c) Se não for sorteado um número dentre os desejados, deve exibir "Ah, me dá um número bom na
 próxima!" -->
<body>
    <center>
        <button onclick="sortearNumero()">Quero um número cabalístico</button>
        <div id="div_mensagem"></div>
    </center>
</body>
</html>
<script>
    function sortearNumero(){
        let numero = Math.random() * (15 - 1) + 1;
        div_mensagem.innerHTML = "";

        if(
            numero.toFixed(0) == 3 || 
            numero.toFixed(0) == 4 ||
            numero.toFixed(0) == 7 ||
            numero.toFixed(0) == 10 ||
            numero.toFixed(0) == 12
        ){
            div_mensagem.innerHTML = ` ${numero.toFixed(0)} <br> Eu S2 números cabalísticos!`
        }
        else {
            div_mensagem.innerHTML = ` ${numero.toFixed(0)} <br> Ah, me dá um número bom na próxima`
        }
    }
</script>
