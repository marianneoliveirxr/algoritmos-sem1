<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<!--a) Ao clicar no botão "Sortear momento do dia". Esse botão vai gerar uma hora aleatória 
entre 0 e 23 (apenas números inteiros).  

b) Em seguida, mostre na tela uma dessas frases:  

     "Bom dia, flor do dia, são Xh!" (caso o horário for entre 0 e 11)  

     "Boa tarde, já vai tarde! São Xh!" (caso o horário for entre 12 e 17)  

     "Boa noite, durma bem! São Xh!" (caso o horário for entre 18 e 23) 

Onde X é um número inteiro sorteado, sem casas decimais. -->
<body>
    <center>
        <button onclick="sortear()">Sortear momento do dia</button>
        <div id="div_mensagem"></div>
    </center>
</body>
</html>
<script>
    function sortear(){
        let horario = Math.random() * 23;
        console.log(horario)

        if(horario.toFixed(0) >= 0 && horario.toFixed(0) <= 11){
            div_mensagem.innerHTML = `Bom dia, flor do dia, são ${horario.toFixed(0)}h!`;
        }
        else if(horario.toFixed(0) >= 12 && horario.toFixed(0) <=17){
            div_mensagem.innerHTML = `Boa tarde, já vai tarde! São ${horario.toFixed(0)}h!`;
        } 
        else if (horario.toFixed(0) >= 18 && horario.toFixed(0) <= 23){
            div_mensagem.innerHTML = `Boa noite, durma bem! São ${horario.toFixed(0)}h!`;
        }

    }
</script>
