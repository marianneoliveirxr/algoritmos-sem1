<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button onclick="exibirNumeroAleatório()">Exibir número aleatório</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function exibirNumeroAleatório(){
        // Ele gera números entre 0 e 10
        // let numeroAleatorio = Math.random() * 10;
        // div_mensagem.innerHTML = `${numeroAleatorio.toFixed(0)}`;

        //Gera números entre 10 e 20 -> Math.random() * (maximo - minimo) + minimo,
        let numeroAleatorio = Math.random() * (20 - 10) + 10;
        div_mensagem.innerHTML = `${numeroAleatorio.toFixed(0)}`;

        //Caso não use o toFixed e sim o ParseInt, coloque + 1 dentro do parênteses 
        // depois do 10 
    }
</script>
