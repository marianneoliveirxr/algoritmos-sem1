<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papagaio Falante</title>
</head>
<!-- Crie um programa o qual:
 
a) Pergunte ao usuário um número;  

b) Pergunte ao usuário uma frase.  

c) Ao clicar num botão "Papagaio", 
a frase é exibida N vezes em N alerts, onde N é o número informado em a)   -->
<body>
    <p>Informe um número:</p>
    <input type="number" id="ipt_num">

    <p>Informe uma frase:</p>
    <input type="text" id="ipt_frase">

    <button onclick="papagaioFalante()">Papagaio</button>
</body>
</html>
<script>
    function papagaioFalante(){
        let contador = 0;
        let vezes = Number(ipt_num.value);
        let frase = ipt_frase.value;

        while (contador <= vezes){
            alert(frase);
            contador++;
        }
    }
</script>
