<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada Colorida</title>
</head>
<!-- Crie um programa o qual:
 
a) Pergunte, numa input ou lista suspensa (select/option), 
qual a tabuada que o usuário quer ver na tela (2 a 9);  

b) Pergunte até que número a tabuada deve ser construída;  

c) Ao clicar no botão “Ver Tabuada”, exiba abaixo a tabuada como 
neste exemplo (considerando que o usuário escolheu a tabuada do 3 e para ir até o 12).  

    3 x 1 = 3   

    3 x 2 = 6   

    3 x 3 = 9   

    3 x 4 = 12   

    3 x 5 = 15   

    3 x 6 = 18   

    3 x 7 = 21   

    3 x 8 = 24   

    3 x 9 = 27   

    3 x 10 = 30   

    3 x 11 = 33   

    3 x 12 = 36   

d) Observar que quando o multiplicador for ímpar, a linha apareça na cor vermelha e
quando for par, na cor azul. ex: "3 x 1 = 3" aparecer tudo em vermelho, mas "3 x 4 = 12" 
aparece tudo em azul.    -->
<body>
    <h1>Tabuada Colorida</h1>
    <p>Qual tabuada voce deseja ver na tela? (2 a 9)</p>
    <input type="number" id="ipt_tabuada">
    <p>Até qual número a tabuada deve ser construida?</p>
    <input type="number" id="ipt_limite">
    <br><br>
    <button onclick="verTabuada()">ver tabuada</button>
    
    <div id="div_mensagem"></div>
    
</body>
</html>
<script>
    function verTabuada(){
        let numTabuada = Number(ipt_tabuada.value);
        let limiteTabuada = Number(ipt_limite.value);

        div_mensagem.innerHTML = "";
        let contador = 1;

        while(contador <= limiteTabuada){

            let conta = `${numTabuada} X ${contador} = ${numTabuada*contador} <br>`
            let mensagem = "";
            
            if(contador % 2 == 0) {
                mensagem = `<span style="color: blue">${conta}</span>`;
            } else {
                mensagem = `<span style="color: red">${conta}</span>`;
            }

            div_mensagem.innerHTML += mensagem;

            contador++;
        }
    }
</script>
