<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Múltiplos de 5</title>
</head>
<!-- Crie um programa o qual:
 
a) Receba do usuário um número (tem que ser entre 20 e 100)   

b) Ao clicar num botão "Adoro múltiplos de 5"...   

c) Exiba, debaixo do botão, todos os múltiplos de 5 entre 0 e o número 
informado em a), um embaixo do outro. Ex: 5, 10, 15, 20...   -->
<body>
    <p>Informe um número: (entre 20 e 100)</p>
    <input type="number" id="ipt_num">

    <button onclick="mostrarMensagem()">Adoro múltiplos de 5</button>

    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function mostrarMensagem(){
        let numero = Number(ipt_num.value);
        let contador = 0;
        div_mensagem.innerHTML= "";

        if (numero >= 20 && numero <= 100){

            while(contador <= numero){
                if (contador % 5 == 0){
                    div_mensagem.innerHTML += `${contador} <br>`;
                }
                contador++;
            }

        } else {
            div_mensagem.innerHTML = "Informe um número entre 20 e 100";
        }
    }
</script>
