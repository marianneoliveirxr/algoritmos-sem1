<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva o 7!</title>
</head>
<!-- Crie um programa o qual:
 
a) Receba um número (tem que estar entre 0 e 200);  

b) Ter um botão chamado "Viva o 7!"   

c) Ao clicar nesse botão, devem aparecer todos os 
múltiplos de 7 entre 0 e o número informado em a)    -->
<body>
    <p>Informe um número: (entre 0 e 200)</p>
    <input type="number" id="ipt_num">

    <button onclick="mostrarMensagem()">Viva o 7!</button>

    <div id="div_mensagem"></div>
    
</body>
</html>
<script>
    function mostrarMensagem(){
        let numero = Number(ipt_num.value);
        let contador = 0;
        div_mensagem.innerHTML= "";

        if (numero >= 0 && numero <= 100){

            while(contador <= numero){
                if (contador % 7 == 0){
                    div_mensagem.innerHTML += `${contador} <br>`;
                }
                contador++;
            }

        } else {
            div_mensagem.innerHTML = "Informe um número entre 0 e 100";
        }
    }
</script>
