    // Usa o predicate: Recebe um valor e informa se ele é verdadeiro ou falso
    //Remove os itens do vetor que não correspondem àquela condição
    numeros.filter((valor) => {
        return valor % 2 == 0; //já retorna true ao invés de colocar no IF
    }).forEach(
        valor => {
            console.log(valor);
        }
    );

    //.map trabalha com todos os itens do vetor 
    let parOuImpar = numeros.map((valor) =>{
        if(valor % 2 == 0){
            return 'Par'
        } else {
            return 'Ímpar';
        }
    });

    //Considera os itens anteriores e o próximo e realiza alguma operação com esses valores 
    let somar = numeros.reduce(
        (anterior, atual) => {
        return anterior + atual;
    }
);
