<script>

    for(let i=0; i< 10; i++){

        //Continue pula o 4
        if (i == 4){
            continue;
        }
        
        //O break interrompe o laço de repetição quando o contador for igual a 6
        if(i == 6){
            break;
        }

        console.log(i);
    }

    // Exemplo Break
    let frutas = ["Melancia", "Abacaxi", "Morango"];
    let busca = "Melancia";

    for (let i = 0; i< frutas.length; i++){
        console.log(frutas[i]);

        if(busca == frutas[i]){
            console.log("encontrei!!");
            break;
        }

    }
</script>
