<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor + For</title>
</head>
<body>
    <button onclick="mostrarItens()">Mostrar Itens</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function mostrarItens(){
        let itens = ["Maçã", "Banana", "Kiwi"];

        div_mensagem.innerHTML= "";

        for (let i = 0; i < itens.length; i++){
            div_mensagem.innerHTML += `${itens[i]}<br>`;
        }

        
    }
</script>
