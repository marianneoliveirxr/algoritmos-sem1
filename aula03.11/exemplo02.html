<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Você pode entrar?</h1>
    <p>Digite sua idade:</p>
    <input type="number" id="ipt_idade">
    <p>Tem convite?</p>
    <input type="text" id="ipt_convite">
    <p>Está acompanhada de um adulto?</p>
    <input type="text" id="ipt_adulto">
    <button onclick="validarEntrada()">Posso entrar?</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>

// &&

    function validarEntrada(){
        let idade = Number(ipt_idade.value);
        let convite = ipt_convite.value;
        let adulto = ipt_adulto.value;


        if (idade >= 18 && convite == "sim"){
            div_mensagem.innerHTML = `Pode entrar`;
        } else if (idade < 18 && convite == "sim" && adulto == "sim"){
            div_mensagem.innerHTML = `Pode entrar`;
        } else {
            div_mensagem.innerHTML = `Não pode entrar`;
        }
    }

</script>
