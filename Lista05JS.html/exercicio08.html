<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- 8. Meta de Economia: Você Está no Caminho Certo?
Crie um programa o qual: 

a) Pergunte ao usuário qual sua meta de economia; 

b) Pergunte ao usuário quanto tem guardado; 

c) Ao clicar em "Analisar economia"... 

d) Caso a meta tenha sido alcançada, exibir, abaixo do botão, a frase “Parabéns, meta alcançada!”.  

e) Caso a meta tenha sido ultrapassada, exibir a frase anterior e também a frase 
“Meta ultrapassada em X” (onde X é a diferença entre a economia e a meta) 

f) Caso a meta ainda não tenha sido alcançada, exibir, abaixo do botão, a frase 
“Força! Ainda em busca da meta! Falta X” (onde X é a diferença entre a meta e a economia)  -->
<body>
    <h1> 8. Meta de Economia: Você Está no Caminho Certo?</h1>
    <p>Qual a sua meta de economia?</p>
    <input type="number" id="ipt_meta">
    <p>Quanto você tem guardado?</p>
    <input type="number" id="ipt_reserva">
    <br>

    <button onclick="analisarEconomia()">Analisar economia</button>

    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function analisarEconomia(){
        let meta = Number(ipt_meta.value);
        let reserva = Number(ipt_reserva.value);

        if (reserva > meta){
            div_mensagem.innerHTML = `Parabéns, meta alcançada! <br> Meta ultrapassada em R$${reserva - meta}`;

        } else if (reserva == meta){
            div_mensagem.innerHTML = 
            (`Parabéns, meta alcançada!`);

        } else {
            div_mensagem.innerHTML = `Força! Ainda em busca da meta! Falta R$${meta - reserva}`;
        }
    }
</script>
