<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <!-- 
Melhore o exercício 4, de tal forma que: 

a) Sempre que ocorrer uma falha na autenticação, deve aparecer abaixo da frase 
de "Falha de autenticação" uma outra frase, como esta: 

            Você ainda tem 2 tentativa(s) 

b) A ideia é que o usuário tem 3 tentativas de autenticação. Sempre que errar novamente 
na autenticação, o "contador" de tentativas reduz em 1 na tela. 

c) Uma vez que se esgotarem as tentativas, deve surgir mais uma frase abaixo, que seria 

     Usuário BLOQUEADO! Procure seu gerente! 

d) Em caso de usuário bloqueado, não adianta nem tentar fazer uma autenticação com as 
credenciais corretas, que nada mais acontecerá 

e) Caso o usuário autentique com sucesso, sem que tenham sido queimadas as 3 tentativas, 
a mensagem de autenticação aparece normalmente e a frase com a quantidade de tentativas deve 
sumir da tela e deve ser "reiniciada" para as próximas falhas.  -->
<body>
    <h1>7. Autenticação Segura com Tentativas Limitadas</h1>
    <p>Informe o usuário:</p>
    <input type="login" id="ipt_login">
    <p>Informe a senha:</p>
    <input type="password" id="ipt_senha"> <br> <br>

    <select name="" id="ipt_tipoInfo">
        <option value="">Informação Pessoal</option>
        <option value="nascimento">Ano de Nascimento</option>
        <option value="nomeAnimal">Nome do animal de estimação</option>
    </select> <br> <br>

    <!-- Usuário escreve a 3a informação -->
    <input type="text" id="ipt_info"> <br> <br>

    <div id="div_mensagem"></div>

    <button onclick="autenticar()">Autenticar</button>
</body>
</html>
<script>
    let tentativa = 3;
    function autenticar(){
        
        let login = ipt_login.value;
        let password = ipt_senha.value;
        let info = ipt_info.value;

        if((login == "ana" && password == "braga") && (info == "1949" || info == "louro josé")){
                div_mensagem.innerHTML = `Usuário autenticado`;
        } else {
            div_mensagem.innerHTML += `Falha na autenticação <br>`;
            div_mensagem.innerHTML += `Você ainda tem ${-tentativa} tentativa(s) <br>`;

            if (tentativa = 0){
                div_mensagem.innerHTML = `Usuário BLOQUEADO! Procure seu gerente!`;
            }
        }
        
    }
</script>
