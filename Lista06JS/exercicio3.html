<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- Crie um pequeno simulador de preço de passagem de Bilhete Único de São Paulo 
 num programa, o qual: 

a) Tenha uma combo para indicar o tipo de passageiro, com os itens 

            Comum 
            Estudante 
            Idoso/PNE 

b) Tenha uma outra combo, para indicar o tipo de passagem, com os itens 

            Passagem única 
            Passagem integração 

c) Ao clicar num botão "Simular preço", considere que o preço unitário de uma passagem 
única é R$4,40 e que a integração é R$5,90 para fazer os cálculos necessários para exibir uma 
frase como esta: 

            Valor da passagem escolhida: R$X,XX 

d) Considere ainda que um estudante tem 50% de desconto e idoso/PNE possuem gratuidade 
em qualquer tipo de passagem  -->
<body>
    <h1>3. Simulador de Preço do Bilhete Único de São Paulo</h1>
    <p>Informe o tipo de passageiro:</p>
    <p>Comum</p>
    <p>Estudante</p>
    <p>Idoso/PNE</p>
    <input type="text" id="ipt_passageiro">

    <p>Informe o tipo de passagem:</p>
    <p>Passagem única</p>
    <p>Passagem integração</p>
    <input type="text" id="ipt_passagem">

    <button onclick="simularPreco()">Simular preço</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function simularPreco(){
        let passageiro = ipt_passageiro.value;
        let passagem = ipt_passagem.value;
        let preco;

        if (passageiro == "Comum" && passagem == "Passagem única"){
            preco = 4.40;
            div_mensagem.innerHTML = (`Valor da passagem escolhida: R$4.40`);
        } 
        else if (passageiro == "Comum" && passagem == "Passagem integração"){
            div_mensagem.innerHTML = (`Valor da passagem escolhida: R$5.90`);
        }
        else if (passageiro == "Estudante" && passagem == "Passagem única"){
            preco = 4.40/2;
            div_mensagem.innerHTML = (`Valor da passagem escolhida: R$${preco.toFixed(2)}`);

        } 
        else if (passageiro == "Estudante" && passagem == "Passagem integração"){
            preco = 5.90/2;
            div_mensagem.innerHTML = (`Valor da passagem escolhida: R$${preco.toFixed(2)}`);
        } 
        else if (passageiro == "Idoso/PNE" && passagem == "Passagem única"){
            div_mensagem.innerHTML = (`Valor da passagem escolhida: R$0.00`);
        }
        else if (passageiro == "Idoso/PNE" && passagem == "Passagem integração"){
            div_mensagem.innerHTML = (`Valor da passagem escolhida: R$0.00`);
        }
            
        
    }
</script>
